name: Enigma MCP Servers
version: 0.0.1
schema: v1
mcpServers:
  - name: Docker MCP Toolkit
    command: docker
    args:
      - mcp
      - gateway
      - run
    env:
      HOME: "C:\\Users\\izzyo"
      PROGRAMFILES: "C:\\Program Files"
      ProgramData: "C:\\ProgramData"
  - name: KiCAD
    command: node
    args:
      - "D:\\_DATA_\\Repositories\\MCPs\\KiCAD-MCP-Server\\dist\\index.js"
    env:
      KICAD_SEARCH_PATHS: "%CD%"
      PYTHONPATH: "C:\\Program Files\\KiCad\\10.0\\bin"
