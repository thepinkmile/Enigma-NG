name: Rotor Config Worker Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'src/Data/configurations/workers/**'
      - 'test/Data/configurations/workers/**'
      - '.github/workflows/rotor-config-tests.yml'
  pull_request:
    paths:
      - 'src/Data/configurations/workers/**'
      - 'test/Data/configurations/workers/**'
      - '.github/workflows/rotor-config-tests.yml'
  workflow_dispatch:

jobs:
  test:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install pytest pytest-cov

      - name: Run tests with coverage
        working-directory: test/Data/configurations/workers
        env:
          PYTHONPATH: ${{ github.workspace }}/src/Data/configurations/workers
        run: |
          python -m pytest test_worker_utils.py -v \
            --cov=worker_utils \
            --cov=worker_e \
            --cov=worker_f \
            --cov=worker_g \
            --cov=worker_h \
            --cov=orchestrator \
            --cov-report=term-missing \
            --cov-report=html:coverage_report \
            --cov-report=xml:coverage.xml \
            --junitxml=junit.xml \
            2>&1 | tee pytest_output.txt

      - name: Write coverage summary to job
        if: always()
        run: |
          echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -A 10 "coverage:" test/Data/configurations/workers/pytest_output.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-xml-coverage-path: test/Data/configurations/workers/coverage.xml
          junitxml-path: test/Data/configurations/workers/junit.xml
          title: Worker Utils Coverage Report

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report-html
          path: test/Data/configurations/workers/coverage_report/
          retention-days: 30

      - name: Upload XML coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report-xml
          path: test/Data/configurations/workers/coverage.xml
          retention-days: 30
